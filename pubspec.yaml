name: supplychaintracking
description: "A new Flutter project."
version: 1.0.0+1
environment:
  sdk: '>=3.2.3 <4.0.0'
null_safety: true


dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  flutter_map: ^6.1.0
  font_awesome_flutter: ^10.7.0
  flutter_launcher_icons: ^0.13.1
  latlong2: ^0.9.0
  flutter_map_marker_cluster: ^1.3.4
  url_launcher: ^6.0.0
  geolocator: ^10.1.0
  geocoding: ^2.0.0
  http: ^1.2.0
  flutter_mapbox_navigation: ^0.2.2
  fluttertoast: ^8.0.8
  flutter_polyline_points: ^2.0.0
  google_nav_bar: ^5.0.6
  shared_preferences: ^2.0.10
  intl: ^0.17.0
  image_picker: ^0.8.4+4
  path_provider: ^2.0.5
  http_parser: ^4.0.0
  socket_io_client: ^2.0.3+1
  web_socket_channel: ^2.4.0
  stomp_dart_client: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1


flutter:
  uses-material-design: true
  assets:
    - assets/images/icons/
    - assets/images/img/
    - assets/images/
    - assets/images/maps/


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 20
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"

