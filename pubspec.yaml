name: supplychaintracking
description: "A new Flutter project."
version: 1.0.0+1
environment:
  sdk: '>=3.2.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  flutter_launcher_icons: ^0.13.1
  latlong2: ^0.9.0
  flutter_map_marker_cluster: ^1.3.4
  url_launcher: ^6.0.0
  geolocator: ^10.1.0
  geocoding: ^2.0.0
  http: ^1.2.0
  flutter_mapbox_navigation: ^0.2.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/maps/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 20
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"

