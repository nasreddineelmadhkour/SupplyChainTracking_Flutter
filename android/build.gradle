buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
         classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.20"
         classpath 'com.android.tools.build:gradle:7.3.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username 'nasreddine1234'
                password 'sk.eyJ1IjoibmFzcmVkZGluZTEyMzQiLCJhIjoiY2xzZGE5MDcwMHE1MTJrbzVhdjNpcXVtYSJ9.KmiLERK7bwZtVG58zjq0qA'
            }
        }
